[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "azauthlib"
dynamic = ["version"]
description = "Secure Microsoft identity platform authentication helpers built on MSAL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Cedric Moore Jr." }]
keywords = ["azure", "entra", "microsoft-graph", "msal", "oauth2", "authentication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "keyring>=25,<26",
  "msal>=1.31,<2",
  "msal-extensions>=1.2,<2",
  "platformdirs>=4.12.0,<5",
  "portalocker>=2.10,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "setuptools>=83",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/cedricmoorejr/azauthlib"
Issues = "https://github.com/cedricmoorejr/azauthlib/issues"
Repository = "https://github.com/cedricmoorejr/azauthlib"
Changelog = "https://github.com/cedricmoorejr/azauthlib/blob/main/CHANGELOG.md"

[project.scripts]
azauthlib-app = "azauthlib.gui.config_app:main"

[tool.setuptools.dynamic]
version = { attr = "azauthlib.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azauthlib = ["assets/*.png"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=azauthlib --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "UP009"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.coverage.run]
omit = ["src/azauthlib/gui/*"]

[tool.bandit]
exclude_dirs = ["tests"]
